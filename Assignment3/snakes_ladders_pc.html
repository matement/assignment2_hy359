<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Φιδάκι και Σκάλες - CSD Edition 2026</title>
<link rel="stylesheet" href="myStyle.css">
<script src="gamePC.js"></script>
<script src="initBoard.js"></script>

</head>
<body onload="initBoard()">

<div id="gameArea">
	<table id="mainTable">
	</table>
	<div id="sidePanel">
		<div id="modeArea">
			<label for="modeSelect">Δυσκολία: </label>
			<select id="modeSelect" onchange="newGame()">
				<option value="Normal">Normal</option>
				<option value="Hard">Hard</option>
			</select>
		</div>
		<div id="diceArea">
			<button id="diceButton" onclick="play()">Ρίξε το ζάρι</button>
			<img id="diceImage" height="80" width="80" alt="" style="visibility:hidden">
		</div>
		<div id="infoBox"></div>
		<button id="newGameButton" onclick="newGame()">Νέο παιχνίδι</button>
	</div>
</div>

</body>
</html>
